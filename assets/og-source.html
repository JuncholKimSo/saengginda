<!doctype html>
<!-- 공유 썸네일(og.png) 원본. 수정 후 아래 명령으로 재생성:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
       --screenshot=assets/og.png --window-size=1200,630 --hide-scrollbars \
       --virtual-time-budget=8000 file://$(pwd)/assets/og-source.html -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "GmarketSans";
  font-weight: 700;
  src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff") format("woff");
}
* { box-sizing: border-box; margin: 0; }
body {
  width: 1200px;
  height: 630px;
  background: #f2f1ec;
  font-family: "GmarketSans", sans-serif;
  color: #17171a;
  overflow: hidden;
}
.card {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 64px 72px 56px;
  border: 14px solid #17171a;
}
.headline {
  font-size: 76px;
  font-weight: 700;
  line-height: 1.42;
  letter-spacing: -0.01em;
  word-break: keep-all;
}
.blank {
  display: inline-block;
  color: #2b3bf2;
  border-bottom: 12px solid #2b3bf2;
  padding: 0 10px;
  font-size: 88px;
  line-height: 1.15;
}
.foot {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-top: 4px solid #17171a;
  padding-top: 22px;
  font-size: 27px;
  font-weight: 700;
}
.foot .url { color: #2b3bf2; }
</style>
</head>
<body>
<div class="card">
  <div class="headline">
    전남·광주통합특별시에<br>
    <span class="blank">무엇</span>이(가)<br>
    생긴다는데, 바뀐다는데.
  </div>
  <div class="foot">
    <span>삶을 위한 도시 @광주</span>
    <span class="url">yourgwangju.life</span>
  </div>
</div>
</body>
</html>
