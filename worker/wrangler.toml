name = "saengginda"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
GITHUB_REPO = "OWNER/saengginda"      # 배포 전 GitHub 아이디로 바꿀 것
GITHUB_BRANCH = "main"
ALLOWED_ORIGIN = "*"                  # Pages 주소 확정 후 "https://OWNER.github.io" 로 좁힐 것

# 시크릿은 파일에 넣지 말고 아래 명령으로 등록:
#   npx wrangler secret put GITHUB_TOKEN
