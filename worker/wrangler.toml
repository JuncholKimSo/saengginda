name = "saengginda"
main = "worker.js"
compatibility_date = "2026-08-01"

workers_dev = true   # DNS 전파기 예비 경로. 정착 후 false로 바꿔 이름 노출을 없앨 것
routes = [
  { pattern = "api.yourgwangju.life", custom_domain = true }
]

[vars]
GITHUB_REPO = "JuncholKimSo/saengginda"
GITHUB_BRANCH = "main"
# 쉼표 구분 다중 origin. 구주소는 새 도메인 정착 후 제거해도 된다.
ALLOWED_ORIGIN = "https://yourgwangju.life,https://www.yourgwangju.life,https://juncholkimso.github.io"

# 시크릿은 파일에 넣지 말고 아래 명령으로 등록:
#   npx wrangler secret put GITHUB_TOKEN
